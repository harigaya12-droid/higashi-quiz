const questions=[{q:'東京都庁の本庁舎があるのは、東京都の何区？',a:['千代田区','新宿区','渋谷区'],correct:1,why:'東京都庁の本庁舎は、新宿区西新宿にあります。'},{q:'東京都庁第一本庁舎を設計した建築家は誰？',a:['丹下健三','安藤忠雄','隈研吾'],correct:0,why:'東京都庁第一本庁舎は、建築家・丹下健三の設計です。'},{q:'東京都庁第一本庁舎の展望室は何階にある？',a:['30階','45階','60階'],correct:1,why:'東京都庁第一本庁舎の展望室は45階にあります。'}];
let current=0,score=0,answered=false;const game=document.getElementById('game');
function render(){answered=false;const q=questions[current];game.innerHTML=`<div class="status"><span class="pill">第${current+1}問 ／ 全3問</span><span class="pill blue">正解 ${score}問</span></div><div class="question">${q.q}</div><div id="choices">${q.a.map((a,i)=>`<button class="choice" onclick="answer(${i})"><span class="letter">${'ABC'[i]}</span><span>${a}</span></button>`).join('')}</div><div id="result"></div>`}
function answer(i){if(answered)return;answered=true;const q=questions[current],ok=i===q.correct;if(ok)score++;document.querySelector('.pill.blue').textContent=`正解 ${score}問`;document.querySelectorAll('.choice').forEach((b,n)=>{b.disabled=true;if(n===q.correct)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});document.getElementById('result').innerHTML=`<div class="reaction"><img src="${ok?pics.correct:pics.wrong}" alt="${ok?'笑顔で正解を喜ぶひがしゆき':'がっかりするひがしゆき'}"><h2>${ok?'🎉 正解！':'💧 残念、不正解！'}</h2><p>${q.why}</p><button class="btn" onclick="next()">${current===2?'結果を見る':'次の問題へ'} ▶</button></div>`;document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){current++;if(current<questions.length){render();game.scrollIntoView({behavior:'smooth',block:'start'})}else finish()}
function finish(){const all=score===3;game.innerHTML=`<div class="end"><h2>${all?'🎊 全問正解！ 🎊':'🌸 クイズ終了！'}</h2><img src="${all?pics.perfect:score===0?pics.wrong:pics.correct}" alt="${all?'全問正解して大喜びするひがしゆき':'ひがしゆきのリアクション'}"><h2>3問中 ${score}問正解！</h2><p>${all?'おめでとうございます！ ひがしゆきも大喜び！':'ご参加ありがとうございます！ もう一度チャレンジ！'}</p><button class="btn" onclick="restart()">もう一度チャレンジ ↻</button></div>`;game.scrollIntoView({behavior:'smooth',block:'start'})}
function restart(){current=0;score=0;render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
